<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Mask Windows</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="hero">
        
        <!-- Видео -->
        <div class="video-container">
            <video id="video1" autoplay muted loop class="background-video">
                <source src="media/videos/video.mp4" type="video/mp4" />
            </video>
        </div>

        

        <!-- Чёрные блоки с окнами -->
        <div class="text-container">
            <div class="line">
                <span class="black-bg">We’re here</span><span class="window window1"></span><span class="black-bg">to
                    make</span>
            </div>
            <div class="line">
                <span class="black-bg">healthy</span><span class="window window2"></span><span class="black-bg">living
                    effortless,</span>
            </div>
            <div class="line">
                <span class="black-bg">so you can</span><span class="window window3"></span><span class="black-bg">live
                    longer</span>
            </div>
            <div class="line">
                <span class="black-bg">and happier</span><span class="window window4"></span>
            </div>
        </div>
    </div>

    <div class="side-header-left"></div>
    <div class="side-header-right"></div>



    <script>
        const video = document.getElementById('video1');
        video.addEventListener('ended', () => {
            video.currentTime = 0;
            video.play();
        });
    </script>
</body>

</html>
